services:
  mysql-test:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: mondel_test
      MYSQL_USER: mondel_test
      MYSQL_PASSWORD: mondel_test
      MYSQL_ROOT_PASSWORD: mondel_test_root
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --host=127.0.0.1 --user=$$MYSQL_USER
          --password=$$MYSQL_PASSWORD --database=$$MYSQL_DATABASE
          --execute='SELECT 1' --silent
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
